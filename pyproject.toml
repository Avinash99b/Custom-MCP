[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custom-mcp"
version = "0.1.0"
description = "Custom MCP gateway (Phase 0 foundation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Custom MCP" }]
dependencies = [
    "fastmcp==2.14.7",
    "starlette>=0.37",
    "redis>=5",
    "requests>=2.31",
    "jsonschema>=4.20",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
custom-mcp = "custom_mcp.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.20",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.31",
    "types-jsonschema>=4.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/custom_mcp", "src/mcp_plugin_sdk"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["custom_mcp", "mcp_plugin_sdk"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["fakeredis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
