name: CI

on:
  push:
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a branch or PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the interpreter used by every `uv` invocation.
  UV_PYTHON: "3.12"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

  test:
    name: Tests (fake Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      # Default suite runs against fakeredis and needs no external services.
      # tests/real_redis/ self-skips here because redis-server is not installed.
      - name: Pytest
        run: uv run pytest -q

  real-redis:
    name: Tests (real Redis, isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true

      # tests/real_redis/ owns its own redis-server process on a private unix
      # socket with TCP disabled (--port 0, AOF enabled). It never contacts,
      # imports from, or flushes an external Redis (e.g. localhost:6379).
      # Only the *binary* is required on PATH; no Redis service is started.
      - name: Install redis-server binary
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server

      - name: Verify redis-server is on PATH
        run: redis-server --version

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Pytest (real Redis integration)
        run: uv run pytest -q tests/real_redis

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # docker/buildx is preinstalled on ubuntu-latest.
      - name: Build image
        run: docker build -t custom-mcp:ci .

      - name: Validate Compose configuration
        run: docker compose config -q
